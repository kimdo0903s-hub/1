<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - NETFLIX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header"><a class="logo" href="index.html">NETFLIX</a><nav><a href="about.html">회사소개</a><a class="btn btn-red" href="login.html">로그인</a></nav></header>
<main class="auth-wrap">
  <form class="auth-box" id="signupForm" novalidate>
    <h1>회원가입</h1>
    <input type="email" id="email" placeholder="이메일 주소">
    <input type="password" id="password" placeholder="비밀번호 (6자 이상)">
    <input type="password" id="password2" placeholder="비밀번호 확인">
    <button type="submit" class="btn btn-red btn-big">회원가입</button>
    <p class="msg" id="formMsg"></p>
    <p class="small">이미 계정이 있나요? <a class="link" href="login.html">로그인</a></p>
    <p class="small"><a class="link" href="index.html">메인으로 돌아가기</a></p>
  </form>
</main>
<footer class="footer"><a href="index.html">홈</a><a href="about.html">회사소개</a><a href="login.html">로그인</a><p>교육용 학습 프로젝트입니다. 실제 넷플릭스 서비스와 관련이 없습니다.</p></footer>
<script src="js/script.js"></script>
</body></html>
